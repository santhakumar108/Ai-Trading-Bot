name: Daily Paper Trading (Full NSE Universe)

# Three attempts, weekdays: 4:00 PM IST (10:30 UTC, primary -- shortly
# after NSE market close), 5:00 PM IST (11:30 UTC), 6:00 PM IST (12:30
# UTC) -- so results are reliably ready well before a 6:30 PM check, even
# if GitHub's scheduler delays or drops one or two of the three attempts
# (documented as best-effort, not guaranteed to fire at the exact minute).
# The "Skip if already ran today" step makes every attempt after the
# first successful one a true no-op, so this costs nothing extra on a
# normal day where the 4 PM run just works.
# Scans the full ~2302-symbol NSE EQ universe (config/full_universe.yaml)
# using the SAME PaperBroker-only pipeline as the local run -- this
# workflow never places a real order and never touches any live broker.
on:
  schedule:
    - cron: "30 10 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}  # allows a manual "Run workflow" click for testing

# Without this, two triggers close together (GitHub's scheduler delaying
# one into overlapping with the next) can both pass the "already ran
# today" check, both fully regenerate docs/index.html with different
# content, and then race to push -- the loser's rebase hits a genuine
# file-level conflict (not just "behind", an actual unresolvable diff),
# which the retry loop below cannot fix by retrying. `cancel-in-progress:
# false` makes a second trigger WAIT for the first to finish instead of
# running alongside it, so by the time it starts, "already ran today" is
# true and it skips in seconds -- the race can no longer happen.
concurrency:
  group: daily-paper-trade
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit the updated logs/ back to the repo

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip if today's run already completed
        id: check
        run: |
          today=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          if git log --oneline -20 | grep -q "Daily paper-trade run: $today"; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "Today's ($today) run already completed earlier -- this trigger is a no-op catch-up."
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.already_ran != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.already_ran != 'true'
        run: pip install -r requirements.txt

      - name: Run daily paper trade (full universe)
        if: steps.check.outputs.already_ran != 'true'
        run: |
          mkdir -p logs
          {
            echo ""
            echo "===== Paper-trade run (full NSE universe): $(date '+%Y-%m-%d %H:%M:%S') ====="
            python main.py --config config/full_universe.yaml paper-trade
            echo "===== End of run: $(date '+%Y-%m-%d %H:%M:%S') ====="
          } >> logs/paper_trade_run_log.txt 2>&1

      - name: Generate customer dashboard (docs/index.html, served by GitHub Pages)
        if: steps.check.outputs.already_ran != 'true'
        run: python main.py --config config/full_universe.yaml customer-dashboard --html docs/index.html

      - name: Commit updated logs + dashboard
        if: steps.check.outputs.already_ran != 'true'
        run: |
          git config user.name "nse-bot-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f logs/decision_log.csv logs/paper_trade_journal.csv logs/paper_trade_run_log.txt docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Daily paper-trade run: $(TZ='Asia/Kolkata' date '+%Y-%m-%d')"
          # This run can take hours; the remote may have moved (a manual
          # push, or -- belt-and-suspenders alongside the concurrency
          # lock above -- an overlapping run) since checkout. Rebase onto
          # the latest main before pushing, retrying a few times. If the
          # rebase itself hits a genuine conflict (not just "behind"),
          # abort it cleanly rather than leaving the working tree stuck
          # mid-rebase, which would make every subsequent retry fail too.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- pulling and retrying."
            if ! git pull --rebase origin main; then
              echo "Rebase hit a conflict -- aborting it and retrying fresh."
              git rebase --abort || true
              sleep 10
            fi
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
